<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bitcoin Cloud Mining - Authentication</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            padding: 20px;
            max-width: 440px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .auth-card {
            background-color: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .btc-logo {
            width: 50px;
            height: 50px;
            background-color: #f7931a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            margin: 0 auto 12px auto;
            box-shadow: 0 0 15px rgba(247, 147, 26, 0.4);
        }

        .auth-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .auth-subtitle {
            font-size: 12px;
            color: #8e8e93;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            color: #8e8e93;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            background: #27272a;
            border: 1px solid #3f3f46;
            color: #ffffff;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        .form-input:focus {
            border-color: #a855f7;
        }

        .forgot-link-container {
            text-align: right;
            margin-top: -6px;
            margin-bottom: 16px;
        }

        .forgot-link {
            font-size: 12px;
            color: #a855f7;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            background-color: #5856d6;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn-submit:active {
            opacity: 0.9;
            transform: scale(0.99);
        }

        .toggle-mode-box {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #8e8e93;
        }

        .toggle-link {
            color: #a855f7;
            cursor: pointer;
            font-weight: 600;
        }

        /* Modal styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 18px;
            padding: 22px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <div class="btc-logo">₿</div>
            <div id="auth-title" class="auth-title">Welcome Back</div>
            <div id="auth-subtitle" class="auth-subtitle">Sign in to manage your cloud mining dashboard</div>
        </div>

        <div class="form-group">
            <label for="auth-email">Email Address</label>
            <input type="email" id="auth-email" class="form-input" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
            <label for="auth-password">Password</label>
            <input type="password" id="auth-password" class="form-input" placeholder="••••••••" required>
        </div>

        <!-- Forgot Password Trigger Link -->
        <div id="forgot-link-wrap" class="forgot-link-container">
            <a href="#" onclick="showForgotPasswordModal(event)" class="forgot-link">Forgot password?</a>
        </div>

        <div id="referral-field-wrap" class="form-group" style="display: none;">
            <label for="auth-refcode">Referral Code (Optional)</label>
            <input type="text" id="auth-refcode" class="form-input" placeholder="e.g. ORENGO77">
        </div>

        <button id="btn-submit-auth" class="btn-submit" onclick="handleAuthSubmit()">Sign In</button>

        <div class="toggle-mode-box">
            <span id="toggle-label">Don't have an account?</span>
            <span id="toggle-btn" class="toggle-link" onclick="toggleAuthMode()">Sign Up</span>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgot-password-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="font-size: 16px; margin-bottom: 6px;">Reset Password</h3>
            <p style="font-size: 12px; color: #8e8e93; margin-bottom: 14px; line-height: 1.4;">
                Enter your registered email address and we'll send you a password recovery link.
            </p>
            
            <input type="email" id="reset-email-input" class="form-input" placeholder="name@example.com" style="margin-bottom: 14px;">
            
            <div style="display: flex; gap: 10px;">
                <button onclick="sendPasswordReset()" class="btn-submit" style="flex: 1; margin-top: 0; font-size: 14px; padding: 10px;">Send Link</button>
                <button onclick="hideForgotPasswordModal()" style="flex: 1; background: #27272a; border: 1px solid #3f3f46; color: #fff; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer;">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD3aVY-UknaJhL2jLSBESF2vMH-hKUgdf8",
            authDomain: "superorengo-a45f6.firebaseapp.com",
            projectId: "superorengo-a45f6",
            storageBucket: "superorengo-a45f6.firebasestorage.app",
            messagingSenderId: "467264951244",
            appId: "1:467264951244:web:e0e4b0b4a73103b8f94369",
            measurementId: "G-1JQKMGM3K4"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let isSignUpMode = false;

        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = "index.html";
            }
        });

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;

            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const submitBtn = document.getElementById('btn-submit-auth');
            const toggleLabel = document.getElementById('toggle-label');
            const toggleBtn = document.getElementById('toggle-btn');
            const refWrap = document.getElementById('referral-field-wrap');
            const forgotWrap = document.getElementById('forgot-link-wrap');

            if (isSignUpMode) {
                title.innerText = "Create Account";
                subtitle.innerText = "Start mining Bitcoin on the cloud for free";
                submitBtn.innerText = "Register Now";
                toggleLabel.innerText = "Already have an account?";
                toggleBtn.innerText = "Sign In";
                refWrap.style.display = "block";
                forgotWrap.style.display = "none";
            } else {
                title.innerText = "Welcome Back";
                subtitle.innerText = "Sign in to manage your cloud mining dashboard";
                submitBtn.innerText = "Sign In";
                toggleLabel.innerText = "Don't have an account?";
                toggleBtn.innerText = "Sign Up";
                refWrap.style.display = "none";
                forgotWrap.style.display = "block";
            }
        }

        async function handleAuthSubmit() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const refCodeVal = document.getElementById('auth-refcode').value.trim().toUpperCase();

            if (!email || !password) {
                alert("Please fill in both email and password fields.");
                return;
            }

            if (isSignUpMode) {
                try {
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    const uid = userCredential.user.uid;
                    const generatedRef = 'ORENGO' + Math.floor(1000 + Math.random() * 9000);

                    let initialBalance = 0;
                    let referredByVal = "";

                    if (refCodeVal) {
                        const BTC_USD_RATE = 77061.0;
                        initialBalance = 0.50 / BTC_USD_RATE;
                        referredByVal = refCodeVal;
                    }

                    await db.collection("users").doc(uid).set({
                        email: email,
                        balance: initialBalance,
                        hashrate: 15.90,
                        refCode: generatedRef,
                        referredBy: referredByVal,
                        lastSpinDate: "",
                        lastBoost1Time: 0,
                        lastBoost2Time: 0,
                        miningEndTime: 0,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });

                    alert("Registration successful!");
                    window.location.href = "index.html";

                } catch (error) {
                    alert("Registration Error: " + error.message);
                }
            } else {
                auth.signInWithEmailAndPassword(email, password)
                    .then(() => {
                        window.location.href = "index.html";
                    })
                    .catch((error) => {
                        alert("Login Error: " + error.message);
                    });
            }
        }

        function showForgotPasswordModal(event) {
            event.preventDefault();
            const currentEmail = document.getElementById('auth-email').value.trim();
            if (currentEmail) {
                document.getElementById('reset-email-input').value = currentEmail;
            }
            document.getElementById('forgot-password-modal').style.display = 'flex';
        }

        function hideForgotPasswordModal() {
            document.getElementById('forgot-password-modal').style.display = 'none';
        }

        function sendPasswordReset() {
            const resetEmail = document.getElementById('reset-email-input').value.trim();

            if (!resetEmail) {
                alert("Please enter your registered email address.");
                return;
            }

            auth.sendPasswordResetEmail(resetEmail)
                .then(() => {
                    alert("Password reset email sent! Check your inbox (and spam folder) for instructions.");
                    hideForgotPasswordModal();
                    document.getElementById('reset-email-input').value = "";
                })
                .catch((error) => {
                    console.error("Error sending password reset email:", error);
                    alert("Reset Failed: " + error.message);
                });
        }
    </script>
</body>
</html>
