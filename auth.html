<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Authentication - Bitcoin Cloud Mining</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            padding: 20px;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .auth-card {
            background-color: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .auth-title {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 6px;
        }

        .auth-subtitle {
            font-size: 13px;
            color: #8e8e93;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            font-size: 12px;
            color: #8e8e93;
            display: block;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            background-color: #27272a;
            border: 1px solid #3f3f46;
            color: #ffffff;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
        }

        .form-input:focus {
            border-color: #5856d6;
        }

        .btn-submit {
            width: 100%;
            background-color: #5856d6;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .btn-submit:active {
            opacity: 0.9;
            transform: scale(0.99);
        }

        .toggle-text {
            text-align: center;
            font-size: 13px;
            color: #8e8e93;
            margin-top: 16px;
        }

        .toggle-link {
            color: #5856d6;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div id="form-title" class="auth-title">Create Account</div>
        <div id="form-subtitle" class="auth-subtitle">Sign up to start cloud mining</div>

        <!-- Username field (Visible only on Register) -->
        <div class="form-group" id="username-group">
            <label class="form-label">Username</label>
            <input type="text" id="username-input" class="form-input" placeholder="Enter username">
        </div>

        <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" id="email-input" class="form-input" placeholder="name@example.com">
        </div>

        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" id="password-input" class="form-input" placeholder="••••••••">
        </div>

        <!-- Optional Referral Code field (Visible only on Register) -->
        <div class="form-group" id="refcode-group">
            <label class="form-label">Referral Code (Optional)</label>
            <input type="text" id="refcode-input" class="form-input" placeholder="e.g. ORENGO77">
        </div>

        <button id="submit-btn" class="btn-submit" onclick="handleAuthSubmit()">Register</button>

        <div class="toggle-text">
            <span id="toggle-prompt">Already have an account?</span> 
            <span id="toggle-action-btn" class="toggle-link" onclick="toggleAuthMode()">Sign In</span>
        </div>
    </div>

    <!-- FIREBASE & AUTH LOGIC -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD3aVY-UknaJhL2jLSBESF2vMH-hKUgdf8",
            authDomain: "superorengo-a45f6.firebaseapp.com",
            projectId: "superorengo-a45f6",
            storageBucket: "superorengo-a45f6.firebasestorage.app",
            messagingSenderId: "467264951244",
            appId: "1:467264951244:web:e0e4b0b4a73103b8f94369",
            measurementId: "G-1JQKMGM3K4"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let isRegisterMode = true;

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            const title = document.getElementById('form-title');
            const subtitle = document.getElementById('form-subtitle');
            const submitBtn = document.getElementById('submit-btn');
            const togglePrompt = document.getElementById('toggle-prompt');
            const toggleAction = document.getElementById('toggle-action-btn');
            const usernameGroup = document.getElementById('username-group');
            const refcodeGroup = document.getElementById('refcode-group');

            if (isRegisterMode) {
                title.innerText = "Create Account";
                subtitle.innerText = "Sign up to start cloud mining";
                submitBtn.innerText = "Register";
                togglePrompt.innerText = "Already have an account?";
                toggleAction.innerText = "Sign In";
                usernameGroup.style.display = "block";
                refcodeGroup.style.display = "block";
            } else {
                title.innerText = "Welcome Back";
                subtitle.innerText = "Sign in to access your dashboard";
                submitBtn.innerText = "Sign In";
                togglePrompt.innerText = "Don't have an account?";
                toggleAction.innerText = "Register";
                usernameGroup.style.display = "none";
                refcodeGroup.style.display = "none";
            }
        }

        async function handleAuthSubmit() {
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value.trim();
            const username = document.getElementById('username-input').value.trim();
            const inputRefCode = document.getElementById('refcode-input').value.trim().toUpperCase();

            if (!email || !password || (isRegisterMode && !username)) {
                alert("Please fill in all required fields.");
                return;
            }

            if (isRegisterMode) {
                try {
                    // 1. Create Firebase Auth User
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    const user = userCredential.user;
                    const newRefCode = 'ORENGO' + Math.floor(1000 + Math.random() * 9000);

                    const BTC_USD_RATE = 77061.0;
                    let startingBalance = 0;
                    let referredByVal = "";

                    // 2. Handle Referral Bonus if provided ($0.50 for new user)
                    if (inputRefCode) {
                        const querySnapshot = await db.collection("users").where("refCode", "==", inputRefCode).get();
                        if (!querySnapshot.empty) {
                            const referrerDoc = querySnapshot.docs[0];
                            const referrerId = referrerDoc.id;
                            const referrerData = referrerDoc.data();

                            // Prevent self-referral check
                            if (referrerId !== user.uid) {
                                const bonusBtc = 0.50 / BTC_USD_RATE;
                                startingBalance += bonusBtc;
                                referredByVal = inputRefCode;

                                // Give referrer their $0.50 bonus too
                                const referrerNewBalance = (referrerData.balance || 0) + bonusBtc;
                                await db.collection("users").doc(referrerId).update({ balance: referrerNewBalance });
                            }
                        }
                    }

                    // 3. Create Firestore Document for New User starting at 0 balance (plus any referral bonus)
                    await db.collection("users").doc(user.uid).set({
                        username: username,
                        email: email,
                        balance: startingBalance,
                        hashrate: 15.90,
                        refCode: newRefCode,
                        referredBy: referredByVal,
                        lastSpinDate: "",
                        lastBoost1Time: 0,
                        lastBoost2Time: 0,
                        miningEndTime: 0,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    alert("Registration successful!");
                    window.location.href = "index.html";

                } catch (error) {
                    alert("Registration Error: " + error.message);
                }
            } else {
                // Sign In Flow
                auth.signInWithEmailAndPassword(email, password)
                    .then(() => {
                        window.location.href = "index.html";
                    })
                    .catch((error) => {
                        alert("Login Error: " + error.message);
                    });
            }
        }
    </script>
</body>
</html>
