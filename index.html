<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Mining Dashboard</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dashboard-card {
            background-color: #1a1a1e;
            border: 1px solid #27272a;
            border-radius: 20px;
            padding: 24px 20px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            margin-top: 20px;
        }

        .balance-title {
            font-size: 13px;
            color: #a1a1aa;
            margin-bottom: 8px;
        }

        .balance-display {
            font-size: 32px;
            font-weight: bold;
            color: #f97316;
            margin-bottom: 20px;
        }

        .btn-danger {
            width: 100%;
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s;
        }

        .btn-danger:active { opacity: 0.85; transform: scale(0.98); }
    </style>
</head>
<body>

    <div>
        <header style="text-align: center; margin-bottom: 20px;">
            <h2 style="font-size: 22px;">Mining Dashboard</h2>
            <span id="user-email" style="font-size: 12px; color: #a1a1aa;">Loading account...</span>
        </header>

        <div class="dashboard-card">
            <div class="balance-title">Your Bitcoin Balance</div>
            <div id="balanceDisplay" class="balance-display">0.00000000 BTC</div>
            <p style="font-size: 12px; color: #71717a;">Cloud mining active for your account.</p>
        </div>
    </div>

    <div>
        <button class="btn-danger" onclick="logoutUser()">Log Out</button>
    </div>

    <!-- FIREBASE & DASHBOARD LOGIC SCRIPT -->
    <script>
        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyD3aVY-UknaJhL2jLSBESF2vMH-hKUgdf8",
            authDomain: "superorengo-a45f6.firebaseapp.com",
            projectId: "superorengo-a45f6",
            storageBucket: "superorengo-a45f6.firebasestorage.app",
            messagingSenderId: "467264951244",
            appId: "1:467264951244:web:e0e4b0b4a73103b8f94369",
            measurementId: "G-1JQKMGM3K4"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Check Authentication State and Load Personal Balance
        auth.onAuthStateChanged((user) => {
            if (user) {
                // User is signed in, show their email
                document.getElementById("user-email").innerText = user.email;

                // Fetch their unique Firestore document
                const userRef = db.collection("users").doc(user.uid);
                userRef.get().then((doc) => {
                    if (doc.exists) {
                        const userData = doc.data();
                        // Display their unique database balance
                        document.getElementById("balanceDisplay").innerText = (userData.balance || 0) + " BTC";
                    } else {
                        // If document doesn't exist yet, initialize it with 0
                        userRef.set({ email: user.email, balance: 0 });
                        document.getElementById("balanceDisplay").innerText = "0.00000000 BTC";
                    }
                }).catch((error) => {
                    console.error("Error getting user document:", error);
                });

            } else {
                // No user logged in, send them back to login page
                window.location.href = "auth.html";
            }
        });

        // Logout Function
        function logoutUser() {
            auth.signOut().then(() => {
                window.location.href = "auth.html";
            }).catch((error) => {
                alert("Error signing out: " + error.message);
            });
        }
    </script>
</body>
</html>
